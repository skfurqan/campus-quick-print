<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Quick Print</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="mx-auto max-w-2xl p-4 sm:p-6">
      <header class="mb-6 rounded-2xl bg-white p-5 shadow-sm">
        <h1 class="text-2xl font-bold">Campus Quick Print</h1>
        <p class="mt-2 text-sm text-slate-600">
          Upload photos or a PDF, pay with UPI, and track your print queue live.
        </p>
      </header>

      <section class="rounded-2xl bg-white p-5 shadow-sm">
        <form id="printForm" class="space-y-4">
          <div>
            <label for="images" class="mb-1 block text-sm font-medium">Upload Photos (max 10)</label>
            <input
              id="images"
              name="images"
              type="file"
              accept="image/*"
              multiple
              class="block w-full rounded-lg border border-slate-300 p-2 text-sm"
            />
          </div>

          <div>
            <label for="pdf" class="mb-1 block text-sm font-medium">Or Upload Single PDF</label>
            <input
              id="pdf"
              name="pdf"
              type="file"
              accept="application/pdf"
              class="block w-full rounded-lg border border-slate-300 p-2 text-sm"
            />
          </div>

          <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
            <div>
              <label for="colorMode" class="mb-1 block text-sm font-medium">Print Mode</label>
              <select id="colorMode" class="w-full rounded-lg border border-slate-300 p-2 text-sm">
                <option value="bw">Black &amp; White</option>
                <option value="color">Color</option>
              </select>
            </div>

            <div>
              <label for="sideMode" class="mb-1 block text-sm font-medium">Sides</label>
              <select id="sideMode" class="w-full rounded-lg border border-slate-300 p-2 text-sm">
                <option value="single">Single-sided</option>
                <option value="double">Double-sided</option>
              </select>
            </div>

            <div>
              <label for="copies" class="mb-1 block text-sm font-medium">Copies</label>
              <input
                id="copies"
                type="number"
                min="1"
                max="20"
                value="1"
                class="w-full rounded-lg border border-slate-300 p-2 text-sm"
              />
            </div>
          </div>

          <div class="rounded-xl bg-slate-50 p-3 text-sm">
            <div class="flex justify-between py-1"><span>Detected pages</span><span id="pageCount">0</span></div>
            <div class="flex justify-between py-1"><span>Billable sheets</span><span id="sheetCount">0</span></div>
            <div class="flex justify-between py-1"><span>Rate per sheet</span><span id="rate">₹0.00</span></div>
            <div class="mt-2 flex justify-between border-t border-slate-200 pt-2 text-base font-semibold">
              <span>Total</span><span id="total">₹0.00</span>
            </div>
          </div>

          <button
            type="submit"
            class="w-full rounded-xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-400"
            id="submitBtn"
          >
            Upload &amp; Pay
          </button>
        </form>

        <p id="message" class="mt-3 text-sm"></p>
      </section>

      <section id="queueCard" class="mt-6 hidden rounded-2xl bg-white p-5 shadow-sm">
        <h2 class="text-lg font-semibold">Queue Tracking</h2>
        <p class="mt-1 text-sm text-slate-600">Order ID: <span id="orderId">-</span></p>
        <div class="mt-3 grid grid-cols-1 gap-2 text-sm">
          <div class="rounded-lg bg-slate-50 p-3">Payment: <span id="paymentStatus" class="font-medium">pending</span></div>
          <div class="rounded-lg bg-slate-50 p-3">Print: <span id="printStatus" class="font-medium">queued</span></div>
        </div>
        <button
          id="confirmPaymentBtn"
          class="mt-4 w-full rounded-xl border border-indigo-600 px-4 py-2 text-sm font-semibold text-indigo-600 hover:bg-indigo-50"
        >
          I Have Completed UPI Payment
        </button>
      </section>
    </main>

    <script>
      const SUPABASE_URL = "SUPABASE_URL";
      const SUPABASE_ANON_KEY = "SUPABASE_ANON_KEY";
      const UPI_ID = "7416952126@ybl";
      const SHOP_ID = "SHOP_ID";
      const BUCKET = "print-uploads";

      const DEFAULT_PRICING = {
        bw: { single: 1.5, double: 2.5 },
        color: { single: 5.0, double: 8.0 },
      };

      const { createClient } = supabase;
      const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const form = document.getElementById("printForm");
      const imagesInput = document.getElementById("images");
      const pdfInput = document.getElementById("pdf");
      const colorModeEl = document.getElementById("colorMode");
      const sideModeEl = document.getElementById("sideMode");
      const copiesEl = document.getElementById("copies");
      const submitBtn = document.getElementById("submitBtn");
      const messageEl = document.getElementById("message");

      const pageCountEl = document.getElementById("pageCount");
      const sheetCountEl = document.getElementById("sheetCount");
      const rateEl = document.getElementById("rate");
      const totalEl = document.getElementById("total");

      const queueCard = document.getElementById("queueCard");
      const orderIdEl = document.getElementById("orderId");
      const paymentStatusEl = document.getElementById("paymentStatus");
      const printStatusEl = document.getElementById("printStatus");
      const confirmPaymentBtn = document.getElementById("confirmPaymentBtn");

      let currentPageCount = 0;
      let currentOrderId = null;
      let currentChannel = null;
      let currentUpiId = UPI_ID;
      let currentPricing = {
        bw: { ...DEFAULT_PRICING.bw },
        color: { ...DEFAULT_PRICING.color },
      };

      function setMessage(text, type = "info") {
        const colors = {
          info: "text-slate-700",
          error: "text-red-600",
          success: "text-emerald-600",
        };
        messageEl.className = `mt-3 text-sm ${colors[type] || colors.info}`;
        messageEl.textContent = text;
      }

      function calculatePricing() {
        const copies = Math.max(1, Number(copiesEl.value) || 1);
        const colorMode = colorModeEl.value;
        const sideMode = sideModeEl.value;
        const sheets = sideMode === "double" ? Math.ceil(currentPageCount / 2) : currentPageCount;
        const rate = Number(currentPricing[colorMode]?.[sideMode]) || 0;
        const total = sheets * rate * copies;

        pageCountEl.textContent = String(currentPageCount);
        sheetCountEl.textContent = String(sheets);
        rateEl.textContent = `₹${rate.toFixed(2)}`;
        totalEl.textContent = `₹${total.toFixed(2)}`;

        return { copies, sheets, rate, total, colorMode, sideMode };
      }

      function getValidRate(value, fallback) {
        const rate = Number(value);
        return Number.isFinite(rate) && rate > 0 ? rate : fallback;
      }

      async function loadShopConfig() {
        try {
          const { data } = await sb.from("shops").select("*").eq("id", SHOP_ID).maybeSingle();
          if (!data) return;

          currentUpiId = data.upi_id || currentUpiId;
          currentPricing = {
            bw: {
              single: getValidRate(data.bw_single_rate, DEFAULT_PRICING.bw.single),
              double: getValidRate(data.bw_double_rate, DEFAULT_PRICING.bw.double),
            },
            color: {
              single: getValidRate(data.color_single_rate, DEFAULT_PRICING.color.single),
              double: getValidRate(data.color_double_rate, DEFAULT_PRICING.color.double),
            },
          };
          calculatePricing();
        } catch (_) {
          currentPricing = {
            bw: { ...DEFAULT_PRICING.bw },
            color: { ...DEFAULT_PRICING.color },
          };
          calculatePricing();
        }
      }

      async function detectPageCount() {
        const images = imagesInput.files;
        const pdfFile = pdfInput.files[0];

        if (images.length > 0 && pdfFile) {
          setMessage("Please upload either images or one PDF, not both.", "error");
          currentPageCount = 0;
          calculatePricing();
          return;
        }

        if (images.length > 10) {
          setMessage("You can upload a maximum of 10 images.", "error");
          imagesInput.value = "";
          currentPageCount = 0;
          calculatePricing();
          return;
        }

        if (images.length > 0) {
          currentPageCount = images.length;
          setMessage("Image pages detected.");
          calculatePricing();
          return;
        }

        if (pdfFile) {
          try {
            const bytes = await pdfFile.arrayBuffer();
            const doc = await PDFLib.PDFDocument.load(bytes);
            currentPageCount = doc.getPageCount();
            setMessage("PDF pages detected.");
          } catch (error) {
            currentPageCount = 0;
            setMessage("Invalid PDF file.", "error");
          }
          calculatePricing();
          return;
        }

        currentPageCount = 0;
        calculatePricing();
        setMessage("Upload images or a PDF to continue.");
      }

      async function buildA4PdfFromImages(images) {
        const pdfDoc = await PDFLib.PDFDocument.create();
        const A4_WIDTH = 595.28;
        const A4_HEIGHT = 841.89;
        const MARGIN = 24;

        for (const imageFile of images) {
          const bytes = await imageFile.arrayBuffer();
          const mime = imageFile.type.toLowerCase();
          let embedded;

          if (mime.includes("png")) {
            embedded = await pdfDoc.embedPng(bytes);
          } else {
            embedded = await pdfDoc.embedJpg(bytes);
          }

          const page = pdfDoc.addPage([A4_WIDTH, A4_HEIGHT]);
          const scale = Math.min(
            (A4_WIDTH - MARGIN * 2) / embedded.width,
            (A4_HEIGHT - MARGIN * 2) / embedded.height
          );
          const drawWidth = embedded.width * scale;
          const drawHeight = embedded.height * scale;
          const x = (A4_WIDTH - drawWidth) / 2;
          const y = (A4_HEIGHT - drawHeight) / 2;

          page.drawImage(embedded, { x, y, width: drawWidth, height: drawHeight });
        }

        return pdfDoc.save();
      }

      async function preparePdfBytes() {
        const images = Array.from(imagesInput.files || []);
        const pdfFile = pdfInput.files[0];

        if (images.length === 0 && !pdfFile) {
          throw new Error("Please upload images or a PDF.");
        }

        if (images.length > 0 && pdfFile) {
          throw new Error("Upload either images or one PDF, not both.");
        }

        if (images.length > 0) {
          if (images.length > 10) {
            throw new Error("Maximum 10 images are allowed.");
          }
          return new Uint8Array(await buildA4PdfFromImages(images));
        }

        return new Uint8Array(await pdfFile.arrayBuffer());
      }

      async function trackOrder(orderId) {
        queueCard.classList.remove("hidden");
        orderIdEl.textContent = String(orderId);

        const { data, error } = await sb
          .from("print_jobs")
          .select("payment_status, print_status")
          .eq("id", orderId)
          .single();

        if (!error && data) {
          paymentStatusEl.textContent = data.payment_status;
          printStatusEl.textContent = data.print_status;
        }

        if (currentChannel) {
          await sb.removeChannel(currentChannel);
        }

        currentChannel = sb
          .channel(`print-job-${orderId}`)
          .on(
            "postgres_changes",
            {
              event: "UPDATE",
              schema: "public",
              table: "print_jobs",
              filter: `id=eq.${orderId}`,
            },
            (payload) => {
              paymentStatusEl.textContent = payload.new.payment_status;
              printStatusEl.textContent = payload.new.print_status;
            }
          )
          .subscribe();
      }

      async function markPaymentComplete() {
        if (!currentOrderId) return;
        confirmPaymentBtn.disabled = true;

        const { error } = await sb
          .from("print_jobs")
          .update({ payment_status: "paid" })
          .eq("id", currentOrderId)
          .eq("payment_status", "pending");

        confirmPaymentBtn.disabled = false;

        if (error) {
          setMessage(`Unable to update payment status: ${error.message}`, "error");
          return;
        }

        setMessage("Payment marked as paid. Waiting for kiosk printing queue.", "success");
      }

      confirmPaymentBtn.addEventListener("click", markPaymentComplete);

      imagesInput.addEventListener("change", () => {
        if (imagesInput.files.length > 0 && pdfInput.files[0]) {
          pdfInput.value = "";
        }
        detectPageCount();
      });

      pdfInput.addEventListener("change", () => {
        if (pdfInput.files[0] && imagesInput.files.length > 0) {
          imagesInput.value = "";
        }
        detectPageCount();
      });

      colorModeEl.addEventListener("change", calculatePricing);
      sideModeEl.addEventListener("change", calculatePricing);
      copiesEl.addEventListener("change", calculatePricing);
      copiesEl.addEventListener("input", calculatePricing);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        try {
          submitBtn.disabled = true;
          setMessage("Preparing document...");

          await detectPageCount();
          const pricing = calculatePricing();
          if (currentPageCount <= 0) {
            throw new Error("No printable pages detected.");
          }

          const pdfBytes = await preparePdfBytes();
          const filePath = `${SHOP_ID}/${Date.now()}-${crypto.randomUUID()}.pdf`;

          setMessage("Uploading PDF...");
          const uploadResult = await sb.storage.from(BUCKET).upload(filePath, pdfBytes, {
            contentType: "application/pdf",
            upsert: false,
          });

          if (uploadResult.error) {
            throw new Error(uploadResult.error.message);
          }

          setMessage("Creating print order...");
          const { data: order, error: orderError } = await sb
            .from("print_jobs")
            .insert({
              shop_id: SHOP_ID,
              file_path: filePath,
              original_file_name: pdfInput.files[0]?.name || "images-batch.pdf",
              page_count: currentPageCount,
              copy_count: pricing.copies,
              color_mode: pricing.colorMode,
              duplex_mode: pricing.sideMode,
              sheet_count: pricing.sheets,
              total_amount: pricing.total,
              payment_status: "pending",
              print_status: "queued",
            })
            .select("id")
            .single();

          if (orderError) {
            throw new Error(orderError.message);
          }

          currentOrderId = order.id;
          await trackOrder(currentOrderId);

          const upiUrl = `upi://pay?pa=${currentUpiId}&am=${pricing.total.toFixed(2)}&tn=PRINT-${currentOrderId}`;
          setMessage("Order created. Redirecting to UPI app...", "success");
          window.location.href = upiUrl;
        } catch (error) {
          setMessage(error.message || "Something went wrong.", "error");
        } finally {
          submitBtn.disabled = false;
        }
      });

      loadShopConfig();
      detectPageCount();
    </script>
  </body>
</html>
